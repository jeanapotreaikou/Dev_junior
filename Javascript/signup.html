<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <main>
    <h1>Inscription</h1>
    <form action="#" method="post">
      <div>
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" required>
      </div>

      <div>
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="mot-de-passe">Mot de passe</label>
        <input type="password" id="mot-de-passe" name="mot-de-passe" required>
      </div>

      <div>
        <label for="confirmation-mot-de-passe">Confirmation du mot de passe</label>
        <input type="password" id="confirmation-mot-de-passe" name="confirmation-mot-de-passe" required>
      </div>

      <button type="submit">Créer mon compte</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
